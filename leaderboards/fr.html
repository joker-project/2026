<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;500;700;900&display=swap');

  /* Joker palette — must match app.py so the iframe blends with the page.
     Same hex values, same tri-level text scale, same muted accents. */
  :root {
    --bg: #0d0a18;
    --surface: #17132a;
    --surface-2: #1d1734;
    --border: #2a2148;
    --border-strong: #3a2d5e;
    --text-bright: #b9b0d2;
    --text: #948aae;
    --text-dim: #635a78;
    --primary: #67c25a;
    --primary-glow: rgba(103,194,90,0.10);
    --secondary: #9c7bcc;
    --accent: #d062b1;
    /* Rank colors — desaturated metallic tones so they don't compete with
       the muted body. Rank-1 sits between gold and amber, less garish. */
    --rank1: #c9a85a;
    --rank2: #9c93ad;
    --rank3: #b07a5a;
    --ci-bar: rgba(156,123,204,0.22);
    --ci-mean: #9c7bcc;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:
      radial-gradient(ellipse at top right, rgba(156,123,204,0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    font-weight: 400;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }
  .header-left h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-bright);
  }
  .header-left .track-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 10px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
  }
  .header-right {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.8;
  }
  .header-right .live-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--primary);
    margin-right: 4px;
    opacity: 0.6;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 0.2; }
  }

  /* TABLE */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: color 0.15s;
  }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--text-bright); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  tbody tr:hover {
    background: var(--primary-glow);
  }
  td {
    padding: 16px 16px;
    vertical-align: middle;
    color: var(--text);
  }

  /* RANK COLUMN */
  .rank {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    width: 60px;
    text-align: center;
  }
  .rank-1 { color: var(--rank1); }
  .rank-2 { color: var(--rank2); }
  .rank-3 { color: var(--rank3); }
  .rank-other { color: var(--text-dim); }

  /* SYSTEM NAME */
  .system-name {
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.2px;
    color: var(--text-bright);
  }
  tr:hover .system-name { color: var(--primary); }

  /* RATING */
  .rating {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    text-align: center;
    color: var(--text-bright);
  }

  /* CI */
  .ci-cell {
    min-width: 180px;
  }
  .ci-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .ci-bar-wrap {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    position: relative;
    overflow: visible;
  }
  .ci-bar-fill {
    position: absolute;
    top: 0; bottom: 0;
    background: var(--ci-bar);
    border-radius: 2px;
  }
  .ci-bar-mean {
    position: absolute;
    top: -2px; bottom: -2px;
    width: 2px;
    background: var(--ci-mean);
    border-radius: 1px;
    opacity: 0.85;
  }

  /* VOTES */
  .votes {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
  }

  /* FOOTER */
  .footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
</style>

const TOTAL_BATTLES = 40769;
const UPDATED = "2026-06-28 01:28 UTC";
const METHOD = "bt";
let sortKey = "final_ranking", sortDir = "asc";

function rankClass(r) {
  if (r===1) return "rank-1";
  if (r===2) return "rank-2";
  if (r===3) return "rank-3";
  return "rank-other";
}

function render() {
  const d = [...DATA].sort((a,b) => {
    const va=a[sortKey], vb=b[sortKey];
    if (va<vb) return sortDir==="asc"?-1:1;
    if (va>vb) return sortDir==="asc"?1:-1;
    return 0;
  });

  const lo = d.map(x=>x.rating_q025), hi = d.map(x=>x.rating_q975);
  let mn = Math.min(...lo), mx = Math.max(...hi), rng = mx-mn||100;

  document.getElementById("lb-body").innerHTML = d.map(r => {
    const lp = ((r.rating_q025-mn)/rng)*100;
    const wp = ((r.rating_q975-r.rating_q025)/rng)*100;
    const mp = ((r.rating-mn)/rng)*100;
    return `<tr>
      <td class="rank ${rankClass(r.final_ranking)}">${r.final_ranking}</td>
      <td class="system-name">${r.system}</td>
      <td class="rating">${Math.round(r.rating)}</td>
      <td class="ci-cell">
        <div class="ci-label">${Math.round(r.rating_q025)} — ${Math.round(r.rating_q975)}</div>
        <div class="ci-bar-wrap">
          <div class="ci-bar-fill" style="left:${lp}%;width:${wp}%"></div>
          <div class="ci-bar-mean" style="left:${mp}%"></div>
        </div>
      </td>
      <td class="votes">${r.num_battles}</td>
    </tr>`;
  }).join("");

  document.getElementById("total-votes").textContent = TOTAL_BATTLES + " BATTLES";
  document.getElementById("last-updated").textContent = UPDATED + " · " + METHOD.toUpperCase();
}

document.querySelectorAll("th[data-key]").forEach(th => {
  th.addEventListener("click", () => {
    const k = th.getAttribute("data-key");
    document.querySelectorAll("th").forEach(t => t.classList.remove("sorted"));
    th.classList.add("sorted");
    if (sortKey===k) sortDir = sortDir==="asc"?"desc":"asc";
    else { sortKey=k; sortDir = k==="final_ranking"?"asc":"desc"; }
    render();
  });
});

render();
